[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelwatch"
version = "3.7.2"
description = "Self-hosted vulnerability monitoring for shared hosting infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlackRainSentinel" }]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
[project.scripts]
sentinelwatch = "sentinelwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinelwatch*"]

[tool.setuptools.package-data]
sentinelwatch = ["briefing/*.html", "assets/severity/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


